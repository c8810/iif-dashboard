name: daily-iif-update

on:
  schedule:
    # 9:05 PM ET daily (01:05 UTC) — after US energy futures settle
    - cron: "5 1 * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Append today's IIF row
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/daily_update.py

      - name: Commit and push if data changed
        run: |
          git config user.name "iif-bot"
          git config user.email "iif-bot@users.noreply.github.com"
          git add data/iif.json
          git diff --cached --quiet || git commit -m "data: IIF row for $(date +%F)"
          git push
